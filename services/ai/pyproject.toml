[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "anamnesys-ai"
version = "0.1.0"
description = "Internal AI service for Anamnesys"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.140,<0.141",
    "httpx>=0.28,<1",
    "langchain-openai>=1.0.1,<2",
    "langgraph>=1.2,<1.3",
    "lingua-language-detector>=2.1,<3",
    "pydantic-settings>=2.14,<3",
    "uvicorn[standard]>=0.51,<0.52",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.17,<2",
    "pytest>=8,<10",
    "pytest-asyncio>=1.1,<2",
    "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["app"]
