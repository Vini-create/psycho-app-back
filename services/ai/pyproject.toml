[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "anamnesys-ai"
version = "0.1.0"
description = "Internal AI service for Anamnesys"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.140,<0.141",
    "pydantic-settings>=2.14,<3",
    "uvicorn[standard]>=0.51,<0.52",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2.9,<3",
    "pytest>=8,<10",
    "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
